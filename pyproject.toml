[project]
name = "llmmaxxing"
version = "0.1.0"
description = "Self-hosted admission, fair-queue, routing-policy and operations control plane for LiteLLM"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Jrecos" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "cryptography>=44,<47",
    "httpx>=0.28,<1",
    "pydantic>=2.9,<3",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "prometheus-client>=0.21,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
llmmaxxing = "llmmaxxing.cli.main:main"

[dependency-groups]
dev = [
    "asyncpg>=0.30,<1",
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-asyncio>=0.24,<2",
    "jsonschema>=4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmmaxxing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"deploy/litellm/llmmaxxing_guard.py" = ["SIM102", "UP037"]

[tool.ruff.format]
exclude = ["deploy/litellm/llmmaxxing_guard.py"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.uv]
package = true
